name: Release

# The SINGLE release workflow — it owns BOTH artifacts: the npm package
# @ceralive/modem-control AND the ModemManager-stack .debs. There is deliberately NO
# separate release-packaging workflow. Manually dispatched with the unified SemVer tag.
#
# Job graph (each gates the next):
#   tag-guard   — input MUST be exactly vX.Y.Z, else FAIL CLOSED before anything else runs
#   test        — full bun lane + packaging contract lane (test-before-publish)
#   publish-npm — OIDC trusted publishing of @ceralive/modem-control@X.Y.Z (version verified)
#   build-deb   — inject <upstream>-<rev>~ceraliveX.Y.Z into each source changelog, upload
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Unified release tag, exactly vX.Y.Z (no pre-release, no build metadata)"
        required: true
        type: string

permissions:
  contents: read

# Never cancel a release/publish mid-run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  tag-guard:
    name: Tag guard (fail closed on non-vX.Y.Z)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.guard.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # tag-guard.sh accepts ONLY ^v[0-9]+\.[0-9]+\.[0-9]+$ and echoes the stripped X.Y.Z.
      # A pre-release (-rc.1), build metadata (+build5), or missing-v tag exits non-zero,
      # failing this job — and therefore the whole release — before any publish runs.
      - name: Validate release tag
        id: guard
        run: |
          version="$(bash packaging/ci/tag-guard.sh "${{ github.event.inputs.tag }}")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Release tag OK: ${{ github.event.inputs.tag }} -> ${version}"

  test:
    name: Test before publish (bun + packaging)
    needs: tag-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Cache bun install store
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run lint

      - name: Typecheck (tsc --noEmit)
        run: bun run typecheck

      - name: Test (bun)
        run: bun test

      - name: Packaging contract lane
        run: bash packaging/ci/contract.sh

  publish-npm:
    name: Publish @ceralive/modem-control (OIDC trusted publishing)
    needs: [tag-guard, test]
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      # OIDC trusted publishing needs npm >= 11.5.1 (house pattern pins 11.18.0).
      - name: Install pinned trusted-publishing npm
        run: npm install -g npm@11.18.0

      # npm side is VERIFIED (not injected): control/package.json version must equal the
      # release tag's X.Y.Z, else fail closed before publish.
      - name: Verify package version matches the release tag
        working-directory: control
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${{ needs.tag-guard.outputs.version }}" ]; then
            echo "::error::control/package.json version ($PKG) != release tag (${{ needs.tag-guard.outputs.version }})"
            exit 1
          fi
          echo "npm version provenance OK: $PKG"

      - name: Install workspace (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Publish via OIDC trusted publishing
        working-directory: control
        env:
          # Provenance attestations only when the source repo is public.
          NPM_CONFIG_PROVENANCE: ${{ !github.event.repository.private }}
        run: npm publish --access public

  build-deb:
    name: Build .deb set + contract + daemon smoke (real artifacts)
    needs: [tag-guard, test]
    # Runs on the runner host (NOT inside a container): build-bookworm.sh and the contract /
    # smoke scripts each launch their OWN debian:bookworm containers, so the job needs the
    # host docker daemon, not to be a container itself.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # arm64 .debs are built under full-system QEMU (never cross-compiled); register binfmt.
      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      # Real rebuilds. RELEASE_VERSION injects <upstream>-<rev>~ceraliveX.Y.Z into a COPY of
      # each source's debian/changelog inside the container (the committed tree is never
      # mutated), builds in bootstrap order on native amd64 + QEMU arm64, and asserts the
      # 9-package runtime closure per arch. --force-bad-version is applied by inject-deb-version.
      - name: Build the MM 1.24 stack (.deb) — amd64 + arm64
        env:
          RELEASE_VERSION: ${{ github.event.inputs.tag }}
        run: |
          packaging/ci/build-bookworm.sh amd64
          packaging/ci/build-bookworm.sh arm64

      # Package contract: amd64 full (metadata / closure install / upgrade / rollback /
      # coherence / ordering / tag-guard / piuparts); arm64 metadata-level (apt-install under
      # QEMU is prohibitively slow on a runner — the metadata/coherence/ordering proofs run).
      - name: Package contract suite
        run: |
          packaging/ci/test-package-contract.sh amd64
          packaging/ci/test-package-contract.sh arm64

      # Daemon smoke: system D-Bus + polkit + NetworkManager 1.42, start MM, busctl
      # introspect the root ObjectManager, mmcli --version == 1.24.0, udev/FCC/GIR/Vala paths.
      - name: Daemon smoke (amd64)
        run: packaging/ci/daemon-smoke.sh amd64

      # Per-release manifest: the release tag -> the 9 runtime deb versions per arch
      # (Phase-B apt publication consumes this as its package -> source -> version matrix).
      - name: Generate release manifest
        run: packaging/ci/generate-release-manifest.sh "${{ github.event.inputs.tag }}"

      # Upload the REAL built .debs (both arches: 9 runtime + dev/gir/dbgsym) + the manifest as
      # CI release artifacts. Bench devices download this set and `apt install ./*.deb`.
      - name: Upload .deb artifacts + release manifest
        uses: actions/upload-artifact@v7
        with:
          name: modem-stack-debs-${{ needs.tag-guard.outputs.version }}
          path: |
            dist/release-manifest.txt
            packaging/build/amd64/*.deb
            packaging/build/arm64/*.deb
          if-no-files-found: error
