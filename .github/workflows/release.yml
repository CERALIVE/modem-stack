name: Release

# The SINGLE release workflow — it owns BOTH artifacts: the npm package
# @ceralive/modem-control AND the ModemManager-stack .debs. There is deliberately NO
# separate release-packaging workflow. Manually dispatched with the unified SemVer tag.
#
# Job graph (each gates the next):
#   tag-guard   — input MUST be exactly vX.Y.Z, else FAIL CLOSED before anything else runs
#   test        — full bun lane + packaging contract lane (test-before-publish)
#   publish-npm — OIDC trusted publishing of @ceralive/modem-control@X.Y.Z (version verified)
#   build-deb   — inject <upstream>-<rev>~ceraliveX.Y.Z into each source changelog, upload
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Unified release tag, exactly vX.Y.Z (no pre-release, no build metadata)"
        required: true
        type: string

permissions:
  contents: read

# Never cancel a release/publish mid-run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  tag-guard:
    name: Tag guard (fail closed on non-vX.Y.Z)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.guard.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # tag-guard.sh accepts ONLY ^v[0-9]+\.[0-9]+\.[0-9]+$ and echoes the stripped X.Y.Z.
      # A pre-release (-rc.1), build metadata (+build5), or missing-v tag exits non-zero,
      # failing this job — and therefore the whole release — before any publish runs.
      - name: Validate release tag
        id: guard
        run: |
          version="$(bash packaging/ci/tag-guard.sh "${{ github.event.inputs.tag }}")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Release tag OK: ${{ github.event.inputs.tag }} -> ${version}"

  test:
    name: Test before publish (bun + packaging)
    needs: tag-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Cache bun install store
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run lint

      - name: Typecheck (tsc --noEmit)
        run: bun run typecheck

      - name: Test (bun)
        run: bun test

      - name: Packaging contract lane
        run: bash packaging/ci/contract.sh

  publish-npm:
    name: Publish @ceralive/modem-control (OIDC trusted publishing)
    needs: [tag-guard, test]
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      # OIDC trusted publishing needs npm >= 11.5.1 (house pattern pins 11.18.0).
      - name: Install pinned trusted-publishing npm
        run: npm install -g npm@11.18.0

      # npm side is VERIFIED (not injected): control/package.json version must equal the
      # release tag's X.Y.Z, else fail closed before publish.
      - name: Verify package version matches the release tag
        working-directory: control
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${{ needs.tag-guard.outputs.version }}" ]; then
            echo "::error::control/package.json version ($PKG) != release tag (${{ needs.tag-guard.outputs.version }})"
            exit 1
          fi
          echo "npm version provenance OK: $PKG"

      - name: Install workspace (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Publish via OIDC trusted publishing
        working-directory: control
        env:
          # Provenance attestations only when the source repo is public.
          NPM_CONFIG_PROVENANCE: ${{ !github.event.repository.private }}
        run: npm publish --access public

  build-deb:
    name: Build .deb set (specified version injection)
    needs: [tag-guard, test]
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      # git for actions/checkout; devscripts/dpkg-dev provide dch + dpkg-parsechangelog.
      - name: Install build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates devscripts dpkg-dev ccache

      - uses: actions/checkout@v7

      # Strip the leading `v` and inject <upstream>-<rev>~ceraliveX.Y.Z as the top
      # debian/changelog entry of each of the 4 sources via
      #   dch --force-bad-version --newversion "<version>" "CeraLive rebuild"
      # (--force-bad-version is REQUIRED — the tilde version is LOWER than the pinned
      # <upstream>-1 changelog top; plain `dch --newversion` refuses it, per dch(1)).
      # Until the packaging wave lands real changelogs this documents the exact per-source
      # invocation and exits 0.
      - name: Inject encoded .deb version into each source changelog
        env:
          DEBFULLNAME: CeraLive CI
          DEBEMAIL: ci@ceralive.tv
        run: bash packaging/ci/inject-deb-version.sh "${{ github.event.inputs.tag }}"

      - name: Assemble release manifest (tag -> deb versions)
        run: |
          mkdir -p dist
          {
            echo "tag: ${{ github.event.inputs.tag }}"
            echo "version: ${{ needs.tag-guard.outputs.version }}"
            echo "deb_version_suffix: ~ceralive${{ needs.tag-guard.outputs.version }}"
            echo "sources: [ModemManager, libmbim, libqmi, libqrtr-glib]"
          } > dist/release-manifest.txt
          cat dist/release-manifest.txt

      # `warn` (not `error`): no real .deb exists until the packaging wave lands recipes;
      # the manifest still uploads so the release artifact set is present.
      - name: Upload .deb artifacts + release manifest
        uses: actions/upload-artifact@v7
        with:
          name: modem-stack-debs-${{ needs.tag-guard.outputs.version }}
          path: |
            dist/**
            packaging/**/*.deb
          if-no-files-found: warn
