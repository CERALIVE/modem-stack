name: CI (bun)

# Paths-filtered PR lane for the Bun workspace (control/ + cli/). The `push:` trigger
# carries a positive `branches:` filter alongside `paths:` so a PR-branch push does not
# double-fire (CI/CD standard — trigger hygiene).
on:
  pull_request:
    paths:
      - "control/**"
      - "cli/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "biome.json"
      - ".github/workflows/ci-bun.yml"
  push:
    branches: [main]
    paths:
      - "control/**"
      - "cli/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "biome.json"
      - ".github/workflows/ci-bun.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bun:
    name: Lint, typecheck, test (control + cli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Cache bun install store
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run lint

      - name: Typecheck (tsc --noEmit, strict + exactOptionalPropertyTypes)
        run: bun run typecheck

      - name: Test
        run: bun test
